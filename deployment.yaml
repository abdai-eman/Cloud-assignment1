apiVersion: apps/v1
kind: Deployment
metadata:
  name: country-lookup
  namespace: default
spec:
  replicas: 2
  selector:
    matchLabels:
      app: country-lookup
  template:
    metadata:
      labels:
        app: country-lookup
    spec:
      containers:
        - name: country-lookup
          image: geolocator-service:latest
          imagePullPolicy: Never
          ports:
            - containerPort: 8080
          env:
            - name: GEOCODING_BASE_URL
              value: "https://nominatim.openstreetmap.org"
            - name: GEOCODING_USER_AGENT
              value: "CountryLookupStudentAssignment/1.0"
          resources:
            requests:
              cpu: "100m"
              memory: "256Mi"
            limits:
              cpu: "1"
              memory: "512Mi"
          livenessProbe:
            tcpSocket:
              port: 8080
            initialDelaySeconds: 30
            periodSeconds: 10
          readinessProbe:
            tcpSocket:
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: country-lookup
  namespace: default
spec:
  type: ClusterIP
  selector:
    app: country-lookup
  ports:
    - protocol: TCP
      port: 8080
      targetPort: 8080