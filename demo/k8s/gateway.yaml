apiVersion: apps/v1
kind: Deployment
metadata:
  name: geocoding-gateway
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: geocoding-gateway
  template:
    metadata:
      labels:
        app: geocoding-gateway
    spec:
      containers:
        - name: nginx
          image: nginx:stable-alpine
          ports:
            - containerPort: 8080
          volumeMounts:
            - name: config
              mountPath: /etc/nginx/nginx.conf
              subPath: nginx.conf
          readinessProbe:
            tcpSocket:
              port: 8080
          resources:
            requests:
              cpu: 25m
              memory: 32Mi
            limits:
              cpu: 250m
              memory: 128Mi
      volumes:
        - name: config
          configMap:
            name: geocoding-gateway-config
---
apiVersion: v1
kind: Service
metadata:
  name: geocoding-gateway
spec:
  selector:
    app: geocoding-gateway
  ports:
    - port: 8080
      targetPort: 8080
