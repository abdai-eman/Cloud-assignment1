worker_processes 1;
events { worker_connections 128; }
http {
    # One shared application-wide bucket, including requests from both app replicas.
    limit_req_zone $server_name zone=provider:1m rate=1r/s;
    proxy_cache_path /var/cache/nginx/geocoding levels=1:2 keys_zone=geocoding:10m max_size=20m inactive=24h;
    server {
        listen 8080;
        location = /reverse {
            limit_req zone=provider burst=10;
            limit_req_status 503;
            proxy_pass https://nominatim.openstreetmap.org;
            proxy_ssl_server_name on;
            proxy_ssl_verify on;
            proxy_ssl_trusted_certificate /etc/ssl/certs/ca-certificates.crt;
            proxy_set_header Host nominatim.openstreetmap.org;
            proxy_set_header User-Agent $http_user_agent;
            proxy_set_header Accept-Language en;
            proxy_connect_timeout 5s;
            proxy_read_timeout 10s;
            proxy_cache geocoding;
            proxy_cache_key "$request_uri";
            proxy_cache_valid 200 24h;
            proxy_cache_lock on;
            proxy_next_upstream off;
        }
        location / { return 404; }
    }
}
